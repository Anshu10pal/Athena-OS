# Phase F2: node scoring priors. `prior_category` is a fact about the code
# (see app/services/codebase/node_priors.py + CodeFile.prior_category);
# `prior_values` below is the tunable multiplier per category, resolved at
# scoring time (Phase F3) -- same kind/weight split as config/edge_weights.yaml.
prior_values:
  # Phase E4 landed: entry is now real config/code-pattern detection
  # (app/services/codebase/entry_detection.py), prior_source="structural",
  # measured at 5 files on repo 1 (down from 72 false positives under the
  # old fan_in==0-or-basename heuristic). 1.4 per the original brief.
  entry: 1.4
  source: 1.0
  barrel: 0.4
  config: 0.2
  migration: 0.15
  generated: 0.05

# Checked in this order; first match wins. Exactly the patterns named in the
# brief -- not expanded with extra guesses (package.json, pyproject.toml,
# etc.) without being asked.
config_filename_patterns:
  - "*.config.*"
  - "alembic.ini"
  - "setup.py"

migration_path_markers:
  - "alembic/versions/"

generated_filename_suffixes:
  - "_pb2.py"

generated_header_markers:
  - "@generated"
  - "DO NOT EDIT"
  - "This file is automatically generated"
  - "Code generated by"

# Currently unreachable: discovery.py already excludes these before they
# become a CodeFile at all (see DEFAULT_EXCLUDES), so this branch can never
# fire against real ingested data today. Kept so that if discovery's
# exclusion list ever changes, the check is already here -- a known,
# deliberate dead branch, not a bug. Reported as such in the F2 report.
generated_lockfile_names:
  - "package-lock.json"
  - "yarn.lock"
  - "poetry.lock"
